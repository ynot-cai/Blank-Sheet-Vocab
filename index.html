<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：让页面铺到 iPhone 刘海/圆角区域，配合 env(safe-area-inset-*) 使用 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>单词白纸</title>

    <!-- PWA：添加到主屏幕后像 App 一样全屏运行 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" href="./icons/favicon.png" />

    <!-- iOS 专属（不写这些，iOS 会当普通网页打开、图标也会是截图） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="单词白纸" />
    <link rel="apple-touch-icon" href="./icons/180x180.png" />

    <!--
      说明：iOS 的启动画面需要 <link rel="apple-touch-startup-image">（要每种机型各出一张图）。
      这里刻意不做——自用工具没必要为几十个机型准备几十张图，
      iOS 会退化成白屏一闪，观感可以接受。
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
